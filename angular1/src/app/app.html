<h1>{{title}}</h1>
><h2>{{subtitile}}</h2>
<p> La opcion seleccionada es {{option}}.</p>

><div class  =  "menu">
  @for ( item of menuOptions; track  $index){
    <app-button
  [textButton]="item.textButton"
  [labelMessage]="item.labelMessage"
  (buttonClick)="changeMenuOption (item.actionNumber)"
  >
    </app-button>
  }
</div>

<div class = "content" >
  @switch (option) {
    @case (1) {
      <app-game></app-game>
    }
    @case (2) {
      <app-calculadora></app-calculadora>
    }
    @case (3) {
      <app-leonardo></app-leonardo>
    }
    @case (4) {
      <app-corre></app-corre>
    }
    @case (5) {
      <app-nestor></app-nestor>
    }
    @case (6) {
      <app-maraton></app-maraton>
    }
    @case (7) {
      <app-notas></app-notas>
    }

    @default {
      <h3> no se ha seleccionado ninguna opcion </h3>
    }
  }
</div>
